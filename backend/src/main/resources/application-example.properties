spring.application.name=interviewprep
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/interview_prep_db
spring.datasource.username=interviewprep_user
spring.datasource.password=YOUR_PASSWORD_HERE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=dev-only-secret-key-change-this-before-any-real-deployment-abcdef123456
app.jwt.expiration-ms=86400000